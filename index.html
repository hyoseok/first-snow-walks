<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>첫눈 산책 지도</title>
<meta name="robots" content="noindex">
<meta name="description" content="첫눈 오는 날 걷기 좋은 서울 산책길 34곳">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FFFFFF; --sunken:#F3F5F6; --ink:#131920; --muted:#4C565F; --faint:#7B858E; --line:#DDE1E5;
  --accent:#1F5F7E; --wall:#8A6238;
  --c-palace:#B2562B; --c-alley:#2C6B9B; --c-water:#1D7760; --c-mtn:#664A92;
  --fd:"Gowun Batang",Georgia,serif;
  --fs:"IBM Plex Sans KR","Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif;
  --side:372px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--fs);font-size:14px;color:var(--ink);background:var(--paper);overflow:hidden}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:var(--side) 1fr;height:100%}
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--paper);z-index:2}
header{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--fd);font-weight:700;font-size:25px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px 5px 9px;font-size:12.5px;cursor:pointer;line-height:1.2}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{color:var(--faint);background:var(--sunken)}
.chip[aria-pressed="false"] i{background:#C3C9CF}
.chip:focus-visible,.row:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#list{flex:1;min-height:0;overflow-y:auto;padding:4px 0 24px;scroll-behavior:smooth}
.grp{padding:16px 20px 5px;font-size:11.5px;font-weight:600;letter-spacing:.07em;color:var(--c);display:flex;justify-content:space-between}
.grp span{color:var(--faint);font-weight:400;letter-spacing:0}
.row{display:grid;grid-template-columns:26px 1fr;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 20px;cursor:pointer;align-items:start}
.row:hover{background:var(--sunken)}
.row.on{background:#EAF1F5}
.num{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:1px}
.rn{font-weight:500;font-size:14px;line-height:1.4}
.rn b{color:var(--c-palace);font-weight:600;margin-left:3px}
.rd{display:none;color:var(--muted);font-size:13px;line-height:1.65;margin:5px 0 2px}
.rw{display:none;color:var(--faint);font-size:12px;margin:3px 0 7px}
.links{display:none;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.row.on .rd,.row.on .rw{display:block}
.row.on .links{display:flex}
.lk{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--accent);text-decoration:none;background:#fff}
.lk:hover{border-color:var(--accent)}
.tagline{font-size:11.5px;color:var(--faint);margin-left:6px;font-weight:400}
footer{padding:10px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.55}
#mapwrap{position:relative;min-width:0;z-index:0}
#map{position:absolute;inset:0;background:#EEF1F3}
.tools{position:absolute;right:12px;bottom:28px;z-index:500;display:flex;flex-direction:column;gap:8px}
.tool{border:1px solid rgba(0,0,0,.2);background:#fff;border-radius:8px;padding:8px 11px;font-size:12.5px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tool:hover{background:var(--sunken)}
#sheetbtn{display:none}
/* 지도 위 표식 */
.pin{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:600 12px/1 var(--fs);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.pin.hot{width:30px;height:30px;font-size:13px;box-shadow:0 0 0 2px var(--c),0 1px 5px rgba(0,0,0,.5)}
.pin.sel{transform:scale(1.25);box-shadow:0 0 0 3px #131920,0 2px 8px rgba(0,0,0,.5)}
.leaflet-div-icon{background:none;border:0}
.nm{background:rgba(255,255,255,.93);border:1px solid rgba(0,0,0,.18);border-radius:5px;box-shadow:none;padding:2px 6px;font:500 12px/1.3 var(--fs);color:var(--ink);white-space:nowrap}
.nm::before{display:none}
.zfar .nm{display:none}
.me{width:16px;height:16px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 3px 16px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:14px 16px 13px;font:14px/1.6 var(--fs);color:var(--ink);min-width:230px}
.pk{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--c)}
.pt{font-family:var(--fd);font-weight:700;font-size:18px;line-height:1.3;margin:2px 0 6px}
.pd{font-size:13px;color:var(--muted);margin:0 0 6px}
.pw{font-size:12px;color:var(--faint);margin:0 0 9px}
.pa{font-size:11.5px;color:#9A5B00;margin:0 0 8px}
.pl{display:flex;gap:6px;flex-wrap:wrap}
.leaflet-control-layers{border-radius:8px;font:12.5px/1.5 var(--fs)}
.leaflet-container{font-family:var(--fs)}
@media (max-width:760px){
  #app{display:block;position:relative}
  #mapwrap{position:absolute;inset:0}
  #side{position:absolute;left:0;right:0;bottom:0;height:58%;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);transition:transform .25s ease}
  #app.closed #side{transform:translateY(calc(100% - 0px))}
  header{padding:14px 16px 11px}
  h1{font-size:20px}
  .lede{display:none}
  .row{padding:8px 16px}.grp{padding:14px 16px 4px}
  footer{display:none}
  #sheetbtn{display:block}
  .tools{bottom:auto;top:10px;right:10px;flex-direction:row;gap:6px}
  .tool{padding:8px 10px}
  .leaflet-top.leaflet-right{top:46px}
}
@media (prefers-reduced-motion:reduce){#list{scroll-behavior:auto}#side{transition:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>첫눈 산책 지도</h1>
      <p class="lede">“첫눈 내리면 어느 골목을 같이 걸으면 운치있고 로맨틱할까”라는 글에 달린 댓글 393개에서 추린 서울 산책길 34곳. <b style="color:var(--c-palace)">★</b>는 여러 사람이 되풀이해 꼽은 곳.</p>
      <div class="chips" id="chips"></div>
    </header>
    <div id="list"></div>
    <footer>길 선형과 좌표 © OpenStreetMap 기여자. 굵은 색선은 실제 길, 갈색 점선은 한양도성. ‘위치 개략’ 표시가 붙은 곳은 좌표를 어림한 것입니다.</footer>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="tools">
      <button class="tool" id="sheetbtn" type="button">목록 접기</button>
      <button class="tool" id="fit" type="button">전체 보기</button>
      <button class="tool" id="loc" type="button">내 위치</button>
    </div>
  </div>
</div>

      map.flyToBounds(b,{...pad,maxZoom:17,duration:.7});
    }else map.flyToBounds(L.latLng(m.p.lat,m.p.lng).toBounds(500),{...pad,maxZoom:17,duration:.7});
    map.once("moveend",()=>showPopup(m.p));
  }
  m.row.scrollIntoView({block:fly&&!narrow()?"nearest":"start"});
}
const allBounds=L.latLngBounds(P.map(p=>[p.lat,p.lng]));
function fitAll(){map.closePopup(); map.fitBounds(allBounds,narrow()&&!app.classList.contains("closed")?{paddingTopLeft:[20,60],paddingBottomRight:[20,Math.round(innerHeight*.6)]}:{padding:[40,40]})}
document.getElementById("fit").onclick=fitAll;
sb.onclick=()=>{const c=app.classList.toggle("closed"); sb.textContent=c?"목록 펼치기":"목록 접기"};
// 내 위치
let me=null; const lb=document.getElementById("loc");
lb.onclick=()=>{
  if(!navigator.geolocation){lb.textContent="위치 기능 없음";return}
  lb.textContent="찾는 중…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(me)me.setLatLng(ll); else me=L.marker(ll,{icon:L.divIcon({html:'<div class="me"></div>',className:"",iconSize:[16,16],iconAnchor:[8,8]}),interactive:false,zIndexOffset:900}).addTo(map);
    map.flyTo(ll,Math.max(map.getZoom(),15)); lb.textContent="내 위치";
  },()=>{lb.textContent="위치를 못 얻음"},{enableHighAccuracy:true,timeout:10000});
};
// 처음 화면: 도심. 창이 가려진 채 열리면 크기가 0 이라 맞출 수 없으니, 크기가 생길 때 한 번 맞춘다.
const HOME=L.latLngBounds([[37.540,126.958],[37.603,127.018]]); let fitted=false;
function firstFit(){map.invalidateSize(); const s=map.getSize(); if(!fitted&&s.x>50&&s.y>50){fitted=true; map.fitBounds(HOME)}}
new ResizeObserver(firstFit).observe(document.getElementById("map")); firstFit();
</script>
